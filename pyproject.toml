[project]
name = "supervisor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Colin Ulmer", email = "89170268+CGnomazoid@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp[cli]>=2.2.0",
    "mlx>=0.32.2",
    "mlx-lm>=0.31.3",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
]

[project.scripts]
supervisor-mcp = "supervisor.mcp_server:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: loads the judge model (MLX + Qwen2.5-7B weights) - first run downloads ~4.3GB. Run fast-only tests with -m 'not slow'.",
]
