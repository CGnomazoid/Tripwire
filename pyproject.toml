[project]
name = "supervisor"
version = "0.1.0"
description = "A fast, local, non-generative judge model that gates risky AI agent tool calls."
readme = "README.md"
authors = [
    { name = "Colin Ulmer", email = "89170268+CGnomazoid@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp[cli]>=2.2.0",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
]

[project.optional-dependencies]
# Apple Silicon (macOS). Auto-selected by default on Darwin.
mlx = [
    "mlx>=0.32.2; sys_platform == 'darwin'",
    "mlx-lm>=0.31.3; sys_platform == 'darwin'",
]
# CPU-only PyTorch, any platform - works but slow. Prefer `cuda` on Windows/
# Linux with an Nvidia GPU.
torch = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "accelerate>=1.0.0",
]
# PyTorch + CUDA + 4-bit quantization (bitsandbytes), for Windows/Linux with
# an Nvidia GPU. Auto-selected by default on non-Darwin platforms.
cuda = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.44.0; sys_platform != 'darwin'",
]

[project.scripts]
supervisor-mcp = "supervisor.mcp_server:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# README documents `pytest -q` as the fast, no-model-load suite, so make
# that true by default rather than by remembering to type it. An explicit
# -m on the command line overrides this, so `pytest -m slow` still works.
addopts = "-m 'not slow'"
markers = [
    "slow: loads the judge model (Qwen2.5-7B weights, via whichever backend is active) - first run downloads several GB. Run fast-only tests with -m 'not slow'.",
]
