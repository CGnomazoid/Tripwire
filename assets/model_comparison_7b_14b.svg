<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Qwen2.5-7B vs 14B (Instruct, 4-bit) on the Tripwire eval set</text>
  <text x="450" y="54" text-anchor="middle" font-size="12.5" fill="#666666">164 hand-labeled examples, 60/40 calibration/test split (n=124 held out), same prompts and calibration procedure</text>

  <!-- legend -->
  <rect x="340" y="66" width="14" height="14" rx="2" fill="#4C78A8"/>
  <text x="359" y="77" font-size="12.5" fill="#333333">7B (current default)</text>
  <rect x="510" y="66" width="14" height="14" rx="2" fill="#F28E2B"/>
  <text x="529" y="77" font-size="12.5" fill="#333333">14B</text>

  <!-- baseline -->
  <line x1="40" y1="350" x2="860" y2="350" stroke="#cccccc" stroke-width="1"/>

  <!-- Panel 1: Answer accuracy -->
  <text x="140" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Answer accuracy</text>
  <text x="140" y="398" text-anchor="middle" font-size="11" fill="#888888">higher is better</text>
  <rect x="75" y="120.0" width="55" height="230.0" rx="3" fill="#4C78A8"/>
  <text x="102.5" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">70.2%</text>
  <rect x="150" y="151.8" width="55" height="198.2" rx="3" fill="#F28E2B"/>
  <text x="177.5" y="140.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">60.5%</text>

  <!-- Panel 2: should_block direct accuracy -->
  <text x="350" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">should_block accuracy</text>
  <text x="350" y="398" text-anchor="middle" font-size="11" fill="#888888">higher is better · direct, not derived</text>
  <rect x="285" y="120.0" width="55" height="230.0" rx="3" fill="#4C78A8"/>
  <text x="312.5" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">77.6%</text>
  <rect x="360" y="171.3" width="55" height="178.7" rx="3" fill="#F28E2B"/>
  <text x="387.5" y="160.3" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">60.3%</text>

  <!-- Panel 3: ECE -->
  <text x="560" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Calibration ECE</text>
  <text x="560" y="398" text-anchor="middle" font-size="11" fill="#888888">lower is better</text>
  <rect x="495" y="220.2" width="55" height="129.8" rx="3" fill="#4C78A8"/>
  <text x="522.5" y="209.2" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">0.075</text>
  <rect x="570" y="120.0" width="55" height="230.0" rx="3" fill="#F28E2B"/>
  <text x="597.5" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">0.134</text>

  <!-- Panel 4: Latency -->
  <text x="770" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Latency</text>
  <text x="770" y="398" text-anchor="middle" font-size="11" fill="#888888">lower is better · mean, end-to-end</text>
  <rect x="705" y="232.4" width="55" height="117.6" rx="3" fill="#4C78A8"/>
  <text x="732.5" y="221.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">183ms</text>
  <rect x="780" y="120.0" width="55" height="230.0" rx="3" fill="#F28E2B"/>
  <text x="807.5" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">358ms</text>

  <!-- divider lines between panels -->
  <line x1="230" y1="90" x2="230" y2="350" stroke="#eeeeee" stroke-width="1"/>
  <line x1="440" y1="90" x2="440" y2="350" stroke="#eeeeee" stroke-width="1"/>
  <line x1="650" y1="90" x2="650" y2="350" stroke="#eeeeee" stroke-width="1"/>

  <text x="450" y="424" text-anchor="middle" font-size="12" fill="#888888">7B beats 14B on accuracy, should_block accuracy, and calibration — and it's ~2x faster too.</text>
  <text x="450" y="441" text-anchor="middle" font-size="12" fill="#888888">14B's should_block accuracy craters on fs_read (90.9% → 63.6%).</text>
  <text x="450" y="460" text-anchor="middle" font-size="11" fill="#aaaaaa">Latency measured via Judge.ask() end-to-end on an Apple M4 Max (14-core CPU / 32-core GPU, 36GB unified memory)</text>
</svg>
